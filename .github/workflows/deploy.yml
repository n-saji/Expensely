name: Expensely ECR and SSM deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, rollback]
        default: deploy
permissions:
  contents: read
concurrency:
  group: expensely-production
  cancel-in-progress: false
env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: '993371733162'
  ECR_REPOSITORY: expensely
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.EXPENSELY_DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.EXPENSELY_DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - id: login
        if: inputs.action != 'rollback'
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
        if: inputs.action != 'rollback'
      - id: build
        if: inputs.action != 'rollback'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login.outputs.registry }}/expensely:sha-${{ github.sha }}
      - name: Encrypt app environment for this EC2
        if: inputs.action != 'rollback'
        env:
          DEPLOY_CERT: ${{ vars.EXPENSELY_DEPLOY_CERT }}
          APP_DB_URL: ${{ secrets.DB_URL }}
          APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          APP_MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          APP_EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
          APP_REDIS_HOST: ${{ secrets.REDIS_HOST }}
          APP_REDIS_PORT: ${{ secrets.REDIS_PORT }}
          APP_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          APP_REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          APP_GITHUB_CLIENT_ID: ${{ secrets.GIT_CLIENT_ID }}
          APP_GITHUB_CLIENT_SECRET: ${{ secrets.GIT_CLIENT_SECRET }}
          APP_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          APP_DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          APP_ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          APP_FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          APP_AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          APP_AWS_PROFILE_BUCKET_NAME: ${{ secrets.AWS_PROFILE_BUCKET_NAME || 'expensely-profiles-993371733162' }}
        run: |
          umask 077
          python3 - <<'PY'
          import os, pathlib
          values={k[4:]:v for k,v in os.environ.items() if k.startswith('APP_')}
          for key in ('DB_URL','JWT_SECRET','REDIS_HOST'):
              if not values.get(key): raise SystemExit('Missing required app secret: '+key)
          values.update(AWS_REGION='us-east-2', SERVER_PORT='8080')
          if any('\n' in v or '\r' in v for v in values.values()): raise SystemExit('Multiline environment values are not supported')
          pathlib.Path('app.env').write_text(''.join(k+'='+v+'\n' for k,v in values.items()))
          pathlib.Path('deploy-cert.pem').write_text(os.environ['DEPLOY_CERT'])
          PY
          openssl cms -encrypt -binary -aes-256-cbc -in app.env -outform DER -out app.env.enc deploy-cert.pem
          rm -f app.env
      - name: Deploy or roll back through restricted SSM document
        env:
          ACTION: ${{ inputs.action || 'deploy' }}
          DIGEST: ${{ steps.build.outputs.digest }}
          INSTANCE: ${{ vars.EXPENSELY_EC2_INSTANCE_ID }}
          DOCUMENT: ${{ vars.EXPENSELY_SSM_DOCUMENT }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64
          rollback=os.environ['ACTION']=='rollback'
          params={'Action':[os.environ['ACTION']], 'Image':['' if rollback else '993371733162.dkr.ecr.us-east-2.amazonaws.com/expensely@'+os.environ['DIGEST']], 'EncryptedEnv':['' if rollback else base64.b64encode(pathlib.Path('app.env.enc').read_bytes()).decode()]}
          pathlib.Path('ssm-parameters.json').write_text(json.dumps(params))
          PY
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name "$DOCUMENT" --parameters file://ssm-parameters.json --query Command.CommandId --output text)
          for i in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo 'EC2 deployment and local HTTPS health checks passed'; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'; exit 1 ;;
            esac
            sleep 5
          done
          echo 'Timed out waiting for deployment'; exit 1
      - name: Remove runner files
        if: always()
        run: rm -f app.env app.env.enc deploy-cert.pem ssm-parameters.json
